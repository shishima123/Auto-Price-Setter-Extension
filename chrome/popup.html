<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 300px;
            padding: 10px 12px;
            font-family: Arial, sans-serif;
            font-size: 13px;
            margin: 0;
            background-color: #eaecef86;
        }

        h3 {
            margin: 0 0 6px 0;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 6px;
        }

        label {
            display: block;
            margin-bottom: 2px;
            font-weight: bold;
            font-size: 13px;
        }

        .radio-row {
            display: flex;
            gap: 12px;
        }

        .radio-row label {
            font-weight: normal;
            margin-bottom: 0;
        }

        .radio-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2px 8px;
        }

        .radio-grid label {
            font-weight: normal;
            margin-bottom: 0;
            font-size: 12px;
        }

        .two-col {
            display: flex;
            gap: 8px;
        }

        .two-col .col {
            flex: 1;
        }

        input[type="text"],
        select {
            width: 100%;
            padding: 5px 6px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 13px;
            background-color: #fff;
        }

        input[type="text"]:focus,
        select:focus {
            outline: none;
            border-color: #f0b90b;
        }

        button {
            width: 100%;
            padding: 8px;
            background-color: #f0b90b;
            color: #000;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            margin-top: 4px;
        }

        .preset-actions {
            display: flex;
            gap: 6px;
            margin-top: 4px;
        }

        .btn-secondary {
            flex: 1;
            padding: 5px 8px;
            background-color: #fff;
            color: #333;
            border: 1px solid #ccc;
            font-weight: normal;
            margin-top: 0;
            font-size: 12px;
        }

        .btn-secondary:hover {
            background-color: #f5f5f5;
        }

        .preset-status {
            font-weight: normal;
            font-size: 11px;
            padding: 1px 6px;
            border-radius: 3px;
            margin-left: 4px;
        }

        .preset-status-loaded {
            color: #0a7d3a;
            background-color: #d6f5e3;
        }

        .preset-status-custom {
            color: #8a6d00;
            background-color: #fff3cd;
        }

        .info {
            margin-top: 6px;
            border-radius: 4px;
            font-size: 12px;
            padding: 6px 8px;
            background-color: #fff;
            border: 1px solid #d0d4dc;
        }

        .current-price {
            color: #0ECB81;
            font-weight: bold;
        }

        .hint {
            font-size: 10px;
            color: #666;
            margin-top: 2px;
        }
    </style>
</head>

<body>

    <h3>Cài Đặt Giá</h3>

    <div class="input-group">
        <label>Preset: <span id="presetStatus" class="preset-status preset-status-custom">Tự chỉnh</span></label>
        <select id="presetSelect">
            <option value="">-- Chọn preset --</option>
        </select>
        <div class="preset-actions" id="presetActions">
            <button type="button" class="btn-secondary" id="savePresetBtn">Lưu preset</button>
            <button type="button" class="btn-secondary" id="deletePresetBtn">Xóa</button>
        </div>
        <div id="savePresetForm" style="display:none; margin-top:4px;">
            <select id="savePresetTarget">
                <option value="__new__">+ Tạo preset mới</option>
            </select>
            <input type="text" id="newPresetName" placeholder="Tên preset mới" style="margin-top:4px; display:none;">
            <div class="preset-actions">
                <button type="button" class="btn-secondary" id="confirmSaveBtn">Lưu</button>
                <button type="button" class="btn-secondary" id="cancelSaveBtn">Hủy</button>
            </div>
        </div>
    </div>

    <div class="input-group">
        <label>Nguồn giá gốc:</label>
        <div class="radio-grid">
            <label><input type="radio" name="priceSource" value="first" checked> Record đầu</label>
            <label><input type="radio" name="priceSource" value="highest"> Cao nhất 5</label>
            <label><input type="radio" name="priceSource" value="lowest"> Thấp nhất 5</label>
            <label><input type="radio" name="priceSource" value="average"> Trung bình 5</label>
            <label><input type="radio" name="priceSource" value="manual"> Nhập tay</label>
        </div>
        <div id="manualPriceWrap" style="display:none; margin-top: 4px;">
            <input type="text" id="manualPrice" placeholder="VD: 0,12345678" inputmode="decimal">
            <div class="hint">Tối đa 8 số thập phân</div>
        </div>
    </div>

    <div class="input-group" id="filterNoiseWrap" style="display:none;">
        <label style="font-weight:normal;">
            <input type="checkbox" id="filterNoise"> Lọc nhiễu (loại giá cực cao/cực thấp)
        </label>
        <div id="filterNoiseInputs" style="display:none; margin-top:4px;" class="two-col">
            <div class="col">
                <label style="font-size:11px;">Lấy N giá:</label>
                <input type="text" id="filterSampleSize" placeholder="10" inputmode="numeric">
            </div>
            <div class="col">
                <label style="font-size:11px;">Ngưỡng nhiễu (%):</label>
                <input type="text" id="filterThreshold" placeholder="5" inputmode="decimal">
            </div>
        </div>
        <div class="hint" id="filterNoiseHint" style="display:none;">Lấy N giá gần nhất, bỏ giá lệch &gt; X% so với median, rồi tính aggregate trên phần còn lại</div>
    </div>

    <div class="input-group">
        <label>Chế độ điều chỉnh:</label>
        <div class="radio-row">
            <label><input type="radio" name="mode" value="percent" checked> Theo %</label>
            <label><input type="radio" name="mode" value="fixed"> Theo Fixed</label>
        </div>
    </div>

    <div class="input-group">
        <label>Giá trị (% hoặc Fixed):</label>
        <input type="text" id="valueInput" placeholder="VD: -5,5 hoặc 10">
        <div class="hint">Fixed: tăng n đơn vị vào phần thập phân cuối</div>
    </div>

    <div class="input-group">
        <label>Phương thức tính:</label>
        <div class="radio-row">
            <label><input type="radio" name="calcMode" value="amount" checked> Số lượng coin</label>
            <label><input type="radio" name="calcMode" value="total"> Tổng tiền</label>
        </div>
    </div>

    <div class="input-group two-col">
        <div class="col">
            <label>Số lượng coin:</label>
            <input type="text" id="amountInput" placeholder="VD: 1.25">
        </div>
        <div class="col">
            <label>Tổng tiền (USDT):</label>
            <input type="text" id="totalInput" placeholder="VD: 100,5">
        </div>
    </div>

    <div class="input-group">
        <label style="font-weight:normal;"><input type="checkbox" id="reverseMode"> Lệnh đảo ngược</label>
    </div>

    <div class="input-group" id="reverseOptions" style="display:none; margin-left: 18px; margin-top: -2px;">
        <div class="radio-grid">
            <label><input type="radio" name="reverseType" value="shrink" checked> Thập phân gần</label>
            <label><input type="radio" name="reverseType" value="subtract"> Giảm đơn vị</label>
            <label><input type="radio" name="reverseType" value="lowest"> Thấp nhất 5</label>
            <label><input type="radio" name="reverseType" value="highest"> Cao nhất 5</label>
            <label><input type="radio" name="reverseType" value="average"> Trung bình 5</label>
        </div>
        <div id="subtractInputWrap" style="display:none; margin-top: 4px;">
            <input type="text" id="subtractValue" placeholder="VD: 5">
            <div class="hint">Trừ N đơn vị ở thập phân cuối. VD: 5 → 0,12345678 → 0,12345673</div>
        </div>
    </div>

    <button id="setPriceBtn">Set Giá</button>

    <div class="info" id="resultInfo">
        <div>Giá hiện tại: <span class="current-price" id="currentPrice">--</span></div>
        <div>Giá sau điều chỉnh: <span class="current-price" id="adjustedPrice">--</span></div>
    </div>

    <script src="popup.js"></script>
</body>

</html>
